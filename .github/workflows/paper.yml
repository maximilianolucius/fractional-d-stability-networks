name: Paper build

on:
  push:
    branches:
      - q1-manuscript-20260925
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-bibtex-extra

      - name: Install figure dependencies
        run: |
          python3 -m pip install --break-system-packages pandas matplotlib

      - name: Generate manuscript figures
        run: |
          python3 paper/figures/generate_figures.py

      - name: Build technical manuscript
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Build compact submission draft
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error submission.tex
          test -s main.pdf

      - name: Show warnings
        if: always()
        working-directory: paper
        run: |
          echo "=== main.log ==="
          grep -E "LaTeX Warning|Package .* Warning|Overfull|Underfull|undefined" main.log || true
          echo "=== submission.log ==="
          grep -E "LaTeX Warning|Package .* Warning|Overfull|Underfull|undefined" submission.log || true

      - name: Upload manuscript PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: q1-manuscript-pdfs
          path: |
            paper/main.pdf
            paper/submission.pdf
          if-no-files-found: error
          retention-days: 30
