name: Paper build

on:
  push:
    branches:
      - q1-manuscript-20260925
    paths:
      - 'paper/**'
      - 'reference-paper/Definitions/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-bibtex-extra texlive-science poppler-utils

      - name: Install figure dependencies
        run: |
          python3 -m pip install --break-system-packages pandas matplotlib

      - name: Generate manuscript figures
        run: |
          python3 paper/figures/generate_figures.py

      - name: Prepare Mathematics MDPI template
        run: |
          set -euo pipefail
          rm -rf paper/Definitions
          cp -R reference-paper/Definitions paper/Definitions
          test -s paper/Definitions/mdpi.cls
          test -s paper/Definitions/journalnames.tex
          test -s paper/Definitions/mdpi.bst
          pdftops -eps paper/Definitions/logo-mdpi-eps-converted-to.pdf paper/Definitions/logo-mdpi.eps
          pdftops -eps paper/Definitions/mathematics-logo-eps-converted-to.pdf paper/Definitions/mathematics-logo.eps
          pdftops -eps paper/Definitions/logo-updates-eps-converted-to.pdf paper/Definitions/logo-updates.eps

      - name: Build Mathematics MDPI submission
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error submission-mdpi.tex
          test -s submission-mdpi.pdf

      - name: Audit MDPI build
        working-directory: paper
        run: |
          pdfinfo submission-mdpi.pdf | grep '^Pages:'
          echo "=== submission-mdpi.log ==="
          grep -E "LaTeX Warning|Package .* Warning|Overfull|Underfull|undefined" submission-mdpi.log || true
          ! grep -Eq "undefined citations|undefined references|There were undefined" submission-mdpi.log

      - name: Build editor submission package
        run: |
          set -euo pipefail
          SLUG=exact_positive_diagonal_matignon_stability_dimension_three
          PKG=dist/$SLUG
          rm -rf dist
          mkdir -p "$PKG/sections" "$PKG/figures/generated"

          cp paper/submission-mdpi.tex "$PKG/$SLUG.tex"
          cp paper/references.bib "$PKG/references.bib"
          cp -R paper/Definitions "$PKG/Definitions"

          cp paper/sections/01-introduction-submission.tex "$PKG/sections/"
          cp paper/sections/02-framework-submission.tex "$PKG/sections/"
          cp paper/sections/03-dimension-two-submission.tex "$PKG/sections/"
          cp paper/sections/04-three-dimensional-threshold.tex "$PKG/sections/"
          cp paper/sections/05-threshold-geometry-submission.tex "$PKG/sections/"
          cp paper/sections/06-ecological-interpretation-submission.tex "$PKG/sections/"
          cp paper/sections/07-computational-validation-submission.tex "$PKG/sections/"
          cp paper/sections/08-discussion-submission.tex "$PKG/sections/"
          cp paper/sections/09-conclusion-submission.tex "$PKG/sections/"

          for i in $(seq -w 1 12); do
            cp paper/figures/generated/panel${i}_*.pdf "$PKG/figures/generated/"
            cp paper/figures/generated/panel${i}_*.png "$PKG/figures/generated/"
          done

          cat > "$PKG/README.txt" <<EOF
          Exact Positive-Diagonal Matignon Stability in Dimension Three:
          A Fractional Deformation of Cain's D-Stability Threshold

          Mathematics / MDPI editor-ready source package.
          Authors: Ibrahim Alraddadi and Thoraya N. Alharthi
          Source commit: ${GITHUB_SHA}

          Build:
            latexmk -pdf -interaction=nonstopmode -halt-on-error $SLUG.tex

          The package is self-contained and uses the Mathematics/MDPI class
          and Definitions supplied with the reference Mathematics manuscript.
          EOF

          (
            cd "$PKG"
            latexmk -pdf -interaction=nonstopmode -halt-on-error "$SLUG.tex"
            test -s "$SLUG.pdf"
            ! grep -Eq "undefined citations|undefined references|There were undefined" "$SLUG.log"
          )

          cp "$PKG/$SLUG.pdf" "dist/$SLUG.pdf"

          (
            cd dist
            zip -qr submission.zip "$SLUG"
          )

          test -s dist/submission.zip
          test -s "dist/$SLUG.pdf"

      - name: Upload MDPI submission
        uses: actions/upload-artifact@v4
        with:
          name: mathematics-mdpi-submission
          path: |
            paper/submission-mdpi.pdf
            dist/exact_positive_diagonal_matignon_stability_dimension_three.pdf
            dist/submission.zip
          if-no-files-found: error
          retention-days: 30
