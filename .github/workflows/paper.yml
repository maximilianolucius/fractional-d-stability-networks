name: Paper build

on:
  push:
    branches:
      - q1-manuscript-20260925
    paths:
      - 'paper/**'
      - '.github/workflows/paper.yml'
  workflow_dispatch:

concurrency:
  group: paper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-bibtex-extra texlive-science

      - name: Install figure dependencies
        run: |
          python3 -m pip install --break-system-packages pandas matplotlib

      - name: Generate manuscript figures
        run: |
          python3 paper/figures/generate_figures.py

      - name: Acquire current SIAM macros
        run: |
          set -euo pipefail
          ZIP_URL="https://epubs.siam.org/pb-assets/macros/standard/siamart_251216.zip"
          if curl -A "Mozilla/5.0" -e "https://epubs.siam.org/journal-authors" -fsSL "$ZIP_URL" -o /tmp/siamart.zip; then
            mkdir -p /tmp/siamart
            unzip -q /tmp/siamart.zip -d /tmp/siamart
            cp "$(find /tmp/siamart -name siamart251216.cls -print -quit)" paper/siamart251216.cls
            cp "$(find /tmp/siamart -name siamplain.bst -print -quit)" paper/siamplain.bst
            echo "SIAM macros acquired from official bundle."
          else
            echo "Official SIAM CDN blocked the CI runner; using a verified December-2025 mirror for build diagnostics only."
            curl -fsSL https://raw.githubusercontent.com/systems-mechanobiology/ROSA/main/siamart251216.cls -o paper/siamart251216.cls
            curl -fsSL https://raw.githubusercontent.com/systems-mechanobiology/ROSA/main/siamplain.bst -o paper/siamplain.bst
          fi
          grep -q "December 2025" paper/siamart251216.cls
          grep -q "siamart251216" paper/siamart251216.cls

      - name: Build technical manuscript
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex

      - name: Build compact submission draft
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error submission.tex
          test -s submission.pdf

      - name: Build official SIAM submission draft
        working-directory: paper
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error submission-siam.tex
          test -s submission-siam.pdf

      - name: Show warnings
        if: always()
        working-directory: paper
        run: |
          echo "=== main.log ==="
          grep -E "LaTeX Warning|Package .* Warning|Overfull|Underfull|undefined" main.log || true
          echo "=== submission.log ==="
          grep -E "LaTeX Warning|Package .* Warning|Overfull|Underfull|undefined" submission.log || true
          echo "=== submission-siam.log ==="
          grep -E "LaTeX Warning|Package .* Warning|Overfull|Underfull|undefined" submission-siam.log || true


      - name: Build editor submission package
        if: success()
        run: |
          set -euo pipefail
          SLUG=exact_positive_diagonal_matignon_stability_dimension_three
          PKG=dist/$SLUG
          rm -rf dist
          mkdir -p "$PKG/sections" "$PKG/figures/generated"

          cp paper/submission-siam.tex "$PKG/$SLUG.tex"
          cp paper/references.bib "$PKG/references.bib"
          cp paper/siamart251216.cls "$PKG/siamart251216.cls"
          cp paper/siamplain.bst "$PKG/siamplain.bst"

          cp paper/sections/01-introduction-submission.tex "$PKG/sections/"
          cp paper/sections/02-framework-submission.tex "$PKG/sections/"
          cp paper/sections/03-dimension-two-submission.tex "$PKG/sections/"
          cp paper/sections/04-three-dimensional-threshold.tex "$PKG/sections/"
          cp paper/sections/05-threshold-geometry-submission.tex "$PKG/sections/"
          cp paper/sections/06-ecological-interpretation-submission.tex "$PKG/sections/"
          cp paper/sections/07-computational-validation-submission.tex "$PKG/sections/"
          cp paper/sections/08-discussion-submission.tex "$PKG/sections/"
          cp paper/sections/09-conclusion-submission.tex "$PKG/sections/"
          cp paper/sections/10-declarations.tex "$PKG/sections/"

          for i in $(seq -w 1 12); do
            cp paper/figures/generated/panel${i}_*.pdf "$PKG/figures/generated/"
            cp paper/figures/generated/panel${i}_*.png "$PKG/figures/generated/"
          done

          cat > "$PKG/README.txt" <<EOF
          Exact Positive-Diagonal Matignon Stability in Dimension Three:
          A Fractional Deformation of Cain's D-Stability Threshold

          Editor-ready source package.
          Source commit: ${GITHUB_SHA}

          Build:
            latexmk -pdf -interaction=nonstopmode -halt-on-error $SLUG.tex

          The package is self-contained: SIAM class/BST, bibliography,
          all included section sources, and all submission figures are present.
          EOF

          (
            cd "$PKG"
            latexmk -pdf -interaction=nonstopmode -halt-on-error "$SLUG.tex"
            test -s "$SLUG.pdf"
          )

          cp "$PKG/$SLUG.pdf" "dist/$SLUG.pdf"

          (
            cd dist
            zip -qr submission.zip "$SLUG"
          )
          test -s dist/submission.zip
          test -s "dist/$SLUG.pdf"

      - name: Upload manuscript PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: q1-manuscript-pdfs
          path: |
            paper/main.pdf
            paper/submission.pdf
            paper/submission-siam.pdf
            dist/exact_positive_diagonal_matignon_stability_dimension_three.pdf
            dist/submission.zip
          if-no-files-found: error
          retention-days: 30
