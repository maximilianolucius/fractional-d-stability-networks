name: Manuscript Build

on:
  push:
    branches:
      - chief/full-manuscript-20260926
      - chief/applied-simulation-20260927
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-science texlive-fonts-recommended texlive-bibtex-extra latexmk poppler-utils

      - name: Compile manuscript
        working-directory: paper
        run: |
          set -o pipefail
          rm -rf Definitions
          cp -R ../reference-paper/Definitions ./Definitions
          pdflatex -interaction=nonstopmode -halt-on-error main.tex | tee build-pass1.log
          bibtex main | tee build-bibtex.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex | tee build-pass2.log
          pdflatex -interaction=nonstopmode -halt-on-error main.tex | tee build-pass3.log
          pdfinfo main.pdf > pdfinfo.txt
          pdftotext main.pdf main.txt
          grep '^Pages:' pdfinfo.txt | tee pagecount.txt
          grep -E 'LaTeX Warning|Package .* Warning|Overfull|Underfull|undefined|Citation.*undefined|Reference.*undefined' main.log > warnings.txt || true
          test -s main.pdf

      - name: Upload manuscript build
        uses: actions/upload-artifact@v4
        with:
          name: manuscript-build
          path: |
            paper/main.pdf
            paper/main.log
            paper/main.bbl
            paper/main.txt
            paper/pdfinfo.txt
            paper/pagecount.txt
            paper/warnings.txt
            paper/build-pass1.log
            paper/build-bibtex.log
            paper/build-pass2.log
            paper/build-pass3.log
          retention-days: 7
