[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fractional-d-stability-networks"
version = "0.1.0"
description = "Research code for fractional-order stability and D-stability in ecological networks"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Maximiliano Lucius"}]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "networkx>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
